@if (isMobile && isMobileVisible) {
  <div (click)="toggle.emit()" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-[2px]"></div>
}

<aside [class]="isMobile ?
       (isMobileVisible ? 'fixed inset-y-0 left-0 z-50 w-64' : 'fixed inset-y-0 left-0 z-50 w-64 -translate-x-full') :
       (isCollapsed ? 'w-20' : 'w-64')"
       class="h-screen bg-white border-r border-[#e5dfd4] shadow-sm flex flex-col transition-all duration-300 ease-in-out">

  <div class="flex-shrink-0 bg-[#1a4231] p-4 relative overflow-hidden flex items-center justify-between">
    <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#f9d71c]"></div>

    @if (!isCollapsed || isMobile) {
      <h3 class="text-xs font-black text-white uppercase tracking-[0.2em] truncate">{{ title }}</h3>
    }

    <button (click)="toggle.emit()" class="text-white hover:text-[#f9d71c] transition-colors">
      <i class="fas" [class.fa-angle-double-left]="!isCollapsed" [class.fa-angle-double-right]="isCollapsed"></i>
    </button>
  </div>

  <nav class="flex-grow overflow-y-auto custom-scrollbar">
    <ng-content select="[menu-items]"></ng-content>
  </nav>

  <div class="border-t border-[#e5dfd4]">
    <ng-content select="[footer]"></ng-content>
  </div>
</aside>
