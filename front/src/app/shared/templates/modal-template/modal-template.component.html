@if (isOpen) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-[2px] p-4 animate-in fade-in duration-200">

    <div class="bg-white w-full max-w-2xl flex flex-col shadow-[0_20px_50px_rgba(0,0,0,0.3)] border border-[#e5dfd4] rounded-none overflow-hidden animate-in zoom-in-95 duration-200">

      <!-- En-tête Modale -->
      <div class="flex-shrink-0 bg-[#1a4231] border-b border-[#1a4231] p-4 relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#f9d71c]"></div>

        <div class="flex justify-between items-start">
          <div class="pl-2">
            <h3 class="text-sm font-black text-white uppercase tracking-[0.2em] leading-none">
              {{ title }}
            </h3>
            @if (description) {
              <p class="text-[10px] text-[#f9d71c] font-bold uppercase tracking-widest mt-1.5 opacity-90 italic">
                {{ description }}
              </p>
            }
          </div>

          <button (click)="close.emit()" class="text-white/60 hover:text-[#f9d71c] transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Corps Modale -->
      <div class="flex-grow p-1 overflow-y-auto max-h-[70vh] custom-scrollbar bg-white text-slate-700">
        <ng-content></ng-content>
      </div>

      <!-- Pied de Modale & Actions -->
      <div class="w-full h-auto sm:h-14 flex-shrink-0 grid grid-cols-2 sm:flex sm:justify-end sm:items-center p-4 sm:px-4 sm:py-0 bg-[#f8f6f2] border-t border-[#e5dfd4] gap-2">

        @if (showCancel) {
          <button (click)="close.emit()"
                  class="w-full sm:w-auto px-5 h-9 text-[10px] font-black uppercase tracking-widest text-slate-600 hover:bg-[#e5dfd4]/50 transition-all border border-[#e5dfd4] rounded-none bg-white">
            {{ cancelLabel }}
          </button>
        }

        @if (showClear) {
          <button (click)="clear.emit()"
                  class="w-full sm:w-auto px-5 h-9 text-[10px] font-black uppercase tracking-widest text-[#1a4231] hover:bg-[#f9d71c]/20 transition-all border border-[#1a4231]/30 rounded-none bg-white">
            {{ clearLabel }}
          </button>
        }

        @if (showValidate) {
          <button (click)="validate.emit()"
                  [ngClass]="{'col-span-2': showCancel && showClear, 'col-span-1': !(showCancel && showClear)}"
                  class="w-full sm:w-auto sm:col-span-1 px-8 h-9 text-[10px] font-black uppercase tracking-widest text-[#f9d71c] bg-[#1a4231] hover:bg-[#1a4231]/90 transition-all shadow-md rounded-none">
            {{ validateLabel }}
          </button>
        }

      </div>

    </div>
  </div>
}
