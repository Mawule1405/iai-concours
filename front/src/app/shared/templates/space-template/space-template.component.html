<div class="h-full flex flex-col overflow-hidden bg-white shadow-xl border border-[#e5dfd4] animate-in fade-in duration-500">

  <div class="flex-shrink-0 flex justify-between items-center bg-white border-b border-[#e5dfd4] h-14 z-20 px-2 sm:px-4">

    <!-- Section Gauche : Icône + Titres -->
    <div class="flex items-center space-x-2 sm:space-x-4 h-full min-w-0 flex-1">
      <div class="h-14 w-10 sm:w-14 flex-shrink-0 flex items-center justify-center border-r border-[#e5dfd4] text-[#1a4231] bg-[#f8f6f2] -ml-2 sm:-ml-4">
        <i [class]="'fas ' + icon + ' text-base sm:text-lg'"></i>
      </div>

      <div class="min-w-0 flex-1 pr-1">
        <h1 class="text-xs sm:text-lg font-black text-[#1a4231] uppercase tracking-tight leading-tight truncate">
          {{ title }}
        </h1>
        <p class="text-[9px] sm:text-[10px] text-[#1a4231]/80 font-black uppercase tracking-wider sm:tracking-[0.2em] mt-0.5 italic truncate">
          {{ subtitle }}
        </p>
      </div>
    </div>

    <!-- Actions personnalisées (Header Actions) -->
    <div class="flex-shrink-0 flex items-center justify-end px-1 sm:px-4 h-full no-print">
      <ng-content select="[header-actions]"></ng-content>
    </div>

    <!-- Boutons d'action (Exporter & Créer) -->
    <div class="flex-shrink-0 flex h-full -mr-2 sm:-mr-4">
      @if (showExport) {
        <button (click)="export.emit()"
                title="Exporter"
                class="flex items-center space-x-2 px-3 sm:px-6 h-full text-[10px] font-bold uppercase tracking-widest text-slate-500 hover:bg-[#f8f6f2] hover:text-[#1a4231] transition-all border-l border-[#e5dfd4]">
          <i class="fas fa-file-export text-xs sm:text-sm"></i>
          <span class="hidden sm:inline">Exporter</span>
        </button>
      }

      @if (showCreate) {
        <button (click)="create.emit()"
                [title]="createLabel"
                class="flex items-center space-x-2 bg-[#1a4231] text-[#f9d71c] px-4 sm:px-8 h-full text-[10px] font-bold uppercase tracking-widest hover:bg-[#1a4231]/90 transition-all rounded-none group border-l border-[#1a4231]">
          <svg class="w-4 h-4 transition-transform group-hover:rotate-90 shrink-0 text-[#f9d71c]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span class="hidden sm:inline">{{ createLabel }}</span>
        </button>
      }
    </div>
  </div>

  <!-- Contenu Principal -->
  <div class="flex-grow h-[calc(100vh-3.5rem)] md:h-[82vh] overflow-y-auto custom-scrollbar bg-white">
    <ng-content></ng-content>
  </div>

</div>
