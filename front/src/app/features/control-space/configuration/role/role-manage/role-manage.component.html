<tx-modal-template
  [isOpen]="isOpen"
  [title]="role.id ? 'Modifier le Rôle' : 'Créer un Nouveau Rôle'"
  [description]="'Configuration des accès et attribution des privilèges système'"
  [validateLabel]="role.id ? 'Mettre à jour' : 'Enregistrer le rôle'"
  (close)="close.emit()"
  (validate)="onSave()">

  <div class="grid grid-cols-12 gap-0 border border-[#e5dfd4]">

    <!-- Colonne Gauche : Formulaire -->
    <div class="col-span-5 p-2 border-r border-[#e5dfd4] space-y-2 bg-white">
      <div>
        <label class="text-[10px] font-black uppercase text-slate-500 block mb-2 tracking-widest">Identifiant Nom</label>
        <input type="text" [(ngModel)]="role.name"
               placeholder="ex: ROLE_ADMIN_SYSTEM"
               class="w-full bg-[#f8f6f2] border border-[#e5dfd4] p-3 text-xs font-bold text-[#1a4231] uppercase focus:border-[#1a4231] focus:bg-white outline-none transition-all rounded-none">
      </div>

      <div>
        <label class="text-[10px] font-black uppercase text-slate-500 block mb-2 tracking-widest">Description Technique</label>
        <textarea [(ngModel)]="role.description"
                  placeholder="Définition des responsabilités du rôle..."
                  class="w-full bg-[#f8f6f2] border border-[#e5dfd4] p-3 text-xs font-medium text-slate-600 h-32 focus:border-[#1a4231] focus:bg-white outline-none transition-all rounded-none resize-none">
        </textarea>
      </div>

      <div class="p-4 bg-[#f8f6f2] border-l-2 border-[#1a4231]">
        <p class="text-[9px] text-[#1a4231] font-black uppercase leading-tight">Information</p>
        <p class="text-[10px] text-slate-600 font-bold mt-1 leading-relaxed">
          Les modifications sur les permissions seront appliquées lors de la prochaine connexion.
        </p>
      </div>
    </div>

    <!-- Colonne Droite : Matrice des Permissions -->
    <div class="col-span-7 flex flex-col bg-[#f8f6f2]">
      <div class="p-4 bg-[#f8f6f2] border-b border-[#e5dfd4] flex justify-between items-center">
        <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">Matrice des Permissions</span>
        <span class="text-[9px] font-black text-[#1a4231] bg-[#f9d71c] px-2 py-1 border border-[#e5dfd4]">
          {{ role.permissions.length }} SÉLECTIONNÉES
        </span>
      </div>

      <div class="max-h-[400px] overflow-y-auto custom-scrollbar p-0 divide-y divide-[#e5dfd4]/60">
        @for (perm of allPermissions; track perm.id) {
          <label class="flex items-center p-4 hover:bg-white cursor-pointer group transition-colors">
            <div class="relative flex items-center justify-center">
              <input type="checkbox"
                     [checked]="isPermissionChecked(perm.id)"
                     (change)="togglePermission(perm)"
                     class="peer appearance-none w-5 h-5 border border-[#e5dfd4] bg-white checked:bg-[#1a4231] checked:border-[#1a4231] transition-all rounded-none cursor-pointer">
              <svg class="absolute w-3 h-3 text-[#f9d71c] hidden peer-checked:block pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
              </svg>
            </div>

            <div class="ml-4">
              <p class="text-[11px] font-black text-[#1a4231] uppercase tracking-tight group-hover:text-[#1a4231]/80 transition-colors">
                {{ perm.name }}
              </p>
              <p class="text-[9px] text-slate-500 font-bold uppercase tracking-tighter mt-0.5">
                {{ perm.description || 'Privilège standard' }}
              </p>
            </div>
          </label>
        } @empty {
          <div class="p-10 text-center">
            <p class="text-[10px] text-slate-400 font-black uppercase italic">Aucune permission disponible</p>
          </div>
        }
      </div>
    </div>

  </div>

</tx-modal-template>
