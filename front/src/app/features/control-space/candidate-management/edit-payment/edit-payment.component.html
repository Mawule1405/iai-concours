<tx-modal-template
  [isOpen]="isOpen"
  [title]=" 'Payment de '+candidateName"
  [description]="'Modification du payment des frais de concours' "
  [validateLabel]=" 'Mise à jour' "
  (close)="closeModal()"
  (validate)="onSubmit()">

  <div class="p-3">
    <form [formGroup]="paymentForm" class="space-y-3">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Date Payment.</label>
          <input type="date" formControlName="paymentDate" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">N° Référence / Trans. *</label>
          <input type="text" formControlName="numberOfTransactions" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">

        </div>

        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mode de Paiement *</label>
          <select formControlName="paymentMethod" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none bg-white">
            @for (method of paymentMethods; track method) {
              <option [value]="method">{{ method }}</option>
            }
          </select>
        </div>



      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tel Trans.</label>
          <input type="text" formControlName="transferPhone" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Heure Trans. *</label>
          <input type="time" formControlName="transferHour" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Montant (FCFA) *</label>
          <input type="number" formControlName="amount" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>

      </div>



    </form>
  </div>
</tx-modal-template>
