<tx-modal-template
  [isOpen]="isOpen"
  [title]=" 'Modifier des informations du candidat'"
  [description]="'Mise à jour des informations du candidat.' "
  [validateLabel]=" 'Mettre à jour' "
  (close)="closeModal()"
  (validate)="onSubmit()">

  <div class="p-3">
    <form [formGroup]="candidateForm"  class="space-y-3">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Date Enr *</label>
          <input type="date" formControlName="enrolmentDate" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nom *</label>
          <input type="text" formControlName="lastName" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Prénom *</label>
          <input type="text" formControlName="firstName" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Date de Naissance *</label>
          <input type="date" formControlName="birthDate" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Genre *</label>
          <select formControlName="gender" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none bg-white">
            <option value="M">Masculin</option>
            <option value="F">Féminin</option>
          </select>
        </div>

      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nationalité *</label>
          <input type="text" formControlName="nationality" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Email </label>
          <input type="email" formControlName="email" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Série Bac *</label>
          <select formControlName="serie" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none bg-white">
            @for (item of seriesList; track item) {
              <option [value]="item">{{ item }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Filière / Option *</label>
          <select formControlName="option" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none bg-white">
            @for (item of optionsList; track item) {
              <option [value]="item">@if (item === Cycle.WORKS_ENGINEERING) {
                INGT
              } @else {
                INGC
              }</option>
            }
          </select>
        </div>

      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Téléphone *</label>
          <input type="text" formControlName="phone" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Téléphone d'un tuteur </label>
          <input type="text" formControlName="tutorPhone" class="w-full px-2.5 py-1.5 text-xs border border-[#e5dfd4] focus:border-[#1a4231] outline-none">
        </div>
      </div>

    </form>
  </div>
</tx-modal-template>
