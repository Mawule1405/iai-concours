# ===================================================================
# CONFIGURATION GENERALE ET SERVEUR (Standard Spring Boot)
# ===================================================================
spring.application.name=iai-concours-api
server.port=${SERVER_PORT:8085}

# ===================================================================
# CONFIGURATION POSTGRESQL / BASE DE DONNEES (Standard Spring Boot)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iai-concours-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zopipo}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURATION FRONTEND (Propriete personnalisee)
# ===================================================================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# ===================================================================
# SECURITE & JWT (Conforme aux conventions Spring)
# ===================================================================
tsc.app.jwt.secret=${TSC_APP_JWT_SECRET:votreSecretTresLongEtSecurisePourLeProjetNoWait2026}
tsc.app.access.time=${TSC_APP_ACCESS_TIME:3600}
tsc.app.refresh.time=${TSC_APP_REFRESH_TIME:86400000}

# ===================================================================
# STOCKAGE & CHIFFREMENT DES FICHIERS (Corrige en kebab-case)
# ===================================================================
app.file.encryption-key=${APP_FILE_ENCRYPTION_KEY:MaCleSecreteDeTrenteDeuxCaractSS}

# ===================================================================
# COMPTE ADMINISTRATEUR INITIAL (Corrige : first-name  last-name)
# ===================================================================
app.admin.username=${APP_ADMIN_USERNAME:password}
app.admin.password=${APP_ADMIN_PASSWORD:username}
app.admin.first-name=${APP_ADMIN_FIRST_NAME:Komlan Mawule}
app.admin.last-name=${APP_ADMIN_LAST_NAME:HELOU}
app.admin.email=${APP_ADMIN_EMAIL:helkmawule@gmail.com}

# ===================================================================
# CONFIGURATION MAIL (Standard Spring Boot)
# ===================================================================


# Proprietes SMTP supplementaires
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true




# ===================================================================
# UPLOAD DE FICHIERS (Standard Spring Boot)
# ===================================================================
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}